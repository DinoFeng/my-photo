version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./thumbnails:/app/thumbnails
      - ./import:/app/import
      - ./export:/app/export
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:./data/db.sqlite
      - MEDIA_PATH=./media
      - THUMBNAIL_PATH=./thumbnails
      - IMPORT_PATH=./import
      - EXPORT_PATH=./export
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped